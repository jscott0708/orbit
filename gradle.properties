org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Firefox's engine uses AndroidX libraries (the app's own code does not)
android.useAndroidX=true
android.nonTransitiveRClass=true
# The browser engine version. "+" = the newest stable Firefox engine each time you build (security fixes every ~4 weeks).
# If a future engine ever stops this project from building, put the last good number here, e.g. 161.0.20261118180411
geckoviewVersion=+
# Your GitHub repository for automatic updates, as owner/name (e.g. jacobsmith/orbit). The GitHub build fills it in
# by itself; set it here too if you build in Android Studio, so that build also looks for updates.
updateRepo=
